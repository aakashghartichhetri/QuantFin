services:
  api:
    build: ./backend
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      API_URL: http://api:8000
      VALIDATION_DATA: /app/data/market_returns_validation.csv
    ports:
      - "8501:8501"
    depends_on:
      - api
