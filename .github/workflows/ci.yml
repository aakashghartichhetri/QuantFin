name: Quantitative Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit and API tests
        run: PYTHONPATH=backend pytest -q backend/tests
      - name: Run model validation workflow
        run: python scripts/run_model_validation.py
      - name: Compile application modules
        run: python -m compileall -q backend dashboard scripts
